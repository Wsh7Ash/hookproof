[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hookproof"
version = "1.0.0"
description = "50 validated webhook and callback security skills plus a hookplan CLI for authorized assessment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["webhooks", "signatures", "agent-skills", "security", "replay-protection"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hookproof = "hookproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"